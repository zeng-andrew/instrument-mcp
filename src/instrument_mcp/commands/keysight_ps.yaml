instrument_type: keysight_ps
description: Keysight/Agilent 66311B 直流电源

model_keywords:
  - "66311B"
  - "66311"
  - "Keysight"
  - "Agilent"
  - "HEWLETT-PACKARD"

commands:
  # ─────────────────────────────────────────────
  # 基础控制
  # ─────────────────────────────────────────────
  - name: ps_idn
    description: 读取仪器标识信息
    annotations:
      readOnlyHint: true
    params: []
    scpi_template:
      query: "*IDN?"

  - name: ps_preset
    description: 恢复电源预设状态
    annotations:
      destructiveHint: true
    params: []
    scpi_template: "*RST"

  - name: ps_opc
    description: 等待操作完成
    annotations:
      readOnlyHint: true
    params: []
    scpi_template:
      query: "*OPC?"

  - name: ps_cls
    description: 清除仪器状态
    annotations:
      destructiveHint: false
    params: []
    scpi_template: "*CLS"

  - name: ps_get_error
    description: 读取错误队列
    annotations:
      readOnlyHint: true
    params: []
    scpi_template:
      query: "SYST:ERR?"

  # ─────────────────────────────────────────────
  # 电压控制
  # ─────────────────────────────────────────────
  - name: ps_set_voltage
    description: 设置输出电压（V）
    annotations:
      destructiveHint: false
    params:
      - name: voltage
        type: number
        description: 电压值（V）
        default: 3.3
    scpi_template:
      write: "VOLT {voltage}"

  - name: ps_get_voltage
    description: 查询设定电压值
    annotations:
      readOnlyHint: true
    params: []
    scpi_template:
      query: "VOLT?"

  - name: ps_meas_voltage
    description: 测量实际输出电压
    annotations:
      readOnlyHint: true
    params: []
    scpi_template:
      query: "MEAS:VOLT?"

  # ─────────────────────────────────────────────
  # 电流控制
  # ─────────────────────────────────────────────
  - name: ps_set_current
    description: 设置电流限制（A）
    annotations:
      destructiveHint: false
    params:
      - name: current
        type: number
        description: 电流值（A）
        default: 1.0
    scpi_template:
      write: "CURR {current}"

  - name: ps_get_current
    description: 查询设定电流限制
    annotations:
      readOnlyHint: true
    params: []
    scpi_template:
      query: "CURR?"

  - name: ps_meas_current
    description: 测量实际输出电流
    annotations:
      readOnlyHint: true
    params: []
    scpi_template:
      query: "MEAS:CURR?"

  # ─────────────────────────────────────────────
  # 输出功率
  # ─────────────────────────────────────────────
  - name: ps_meas_power
    description: 测量实际输出功率
    annotations:
      readOnlyHint: true
    params: []
    scpi_template:
      query: "MEAS:POW?"

  # ─────────────────────────────────────────────
  # 输出开关
  # ─────────────────────────────────────────────
  - name: ps_output_on
    description: 开启输出
    annotations:
      destructiveHint: false
    params: []
    scpi_template:
      write: "OUTP ON"

  - name: ps_output_off
    description: 关闭输出
    annotations:
      destructiveHint: false
    params: []
    scpi_template:
      write: "OUTP OFF"

  - name: ps_get_output_state
    description: 查询输出状态
    annotations:
      readOnlyHint: true
    params: []
    scpi_template:
      query: "OUTP?"

  # ─────────────────────────────────────────────
  # 保护功能
  # ─────────────────────────────────────────────
  - name: ps_set_ovp
    description: 设置过压保护（OVP）
    annotations:
      destructiveHint: false
    params:
      - name: voltage
        type: number
        description: 过压保护值（V）
        default: 4.0
    scpi_template:
      write: "VOLT:PROT {voltage}"

  - name: ps_get_ovp
    description: 查询过压保护值
    annotations:
      readOnlyHint: true
    params: []
    scpi_template:
      query: "VOLT:PROT?"

  - name: ps_set_ocp
    description: 设置过流保护（OCP）
    annotations:
      destructiveHint: false
    params:
      - name: current
        type: number
        description: 过流保护值（A）
        default: 1.5
    scpi_template:
      write: "CURR:PROT {current}"

  - name: ps_get_ocp
    description: 查询过流保护值
    annotations:
      readOnlyHint: true
    params: []
    scpi_template:
      query: "CURR:PROT?"

  - name: ps_clear_prot
    description: 清除保护状态
    annotations:
      destructiveHint: false
    params: []
    scpi_template:
      write: "OUTP:PROT:CLE"

  # ─────────────────────────────────────────────
  # 高级功能
  # ─────────────────────────────────────────────
  - name: ps_set_sense
    description: 设置远端/本地感测
    annotations:
      destructiveHint: false
    params:
      - name: mode
        type: string
        description: 感测模式（INTernal, EXTernal）
        default: "INT"
    scpi_template:
      write: "VOLT:SENS {mode}"

  - name: ps_get_sense
    description: 查询感测模式
    annotations:
      readOnlyHint: true
    params: []
    scpi_template:
      query: "VOLT:SENS?"

  - name: ps_set_range
    description: 设置电压量程
    annotations:
      destructiveHint: false
    params:
      - name: range
        type: string
        description: 量程（LOW, HIGH, AUTO）
        default: "AUTO"
    scpi_template:
      write: "VOLT:RANG {range}"

  - name: ps_get_range
    description: 查询电压量程
    annotations:
      readOnlyHint: true
    params: []
    scpi_template:
      query: "VOLT:RANG?"

  # ─────────────────────────────────────────────
  # 高速数字化采集（66311B/66332A 高速电流数字化仪）
  # 硬件: 固定 4096 点缓冲，最小间隔 15.6 us(~64 kS/s)，单次有限采集，不支持连续流式。
  # 多批拼接覆盖长时长；单批内均匀，批次间存在不可消除的取回阴影（已记录）。
  # 详见 keysight_ps_handler.py 顶部说明。
  # ─────────────────────────────────────────────
  - name: ps_acquire_current
    description: >
      高速采集电流(或电压)并写 CSV。用满 4096 点缓冲，多批拼接覆盖指定总时长。
      单批内采样绝对均匀(间隔=1/采样率)；批次间存在取回阴影(已记录到 CSV 的 shadow_flag 列)。
      降低采样率可增大单批覆盖时长、减少批次数、压低阴影占比。
      硬件上限 ~64103 Hz(15.6us)；建议 100~5000 Hz。大数据写文件，返回 JSON 摘要。
    annotations:
      readOnlyHint: true
    params:
      - name: output_path
        type: string
        description: "CSV 输出路径（列: batch_index,t_offset_s,value,shadow_flag）"
        default: "power_supply_acquire.csv"
      - name: sample_rate_hz
        type: number
        description: 采样率(Hz)。越低单批越长、阴影占比越小。上限 ~64103。
        default: 1000.0
      - name: duration_s
        type: number
        description: 总采集时长(秒)
        default: 10.0
      - name: function
        type: string
        description: 采集量 CURR(电流) 或 VOLT(电压)
        default: "CURR"
    handler: "instrument_mcp.commands.keysight_ps_handler.ps_acquire_current"

  - name: ps_acquire_abort
    description: 中止正在进行的扫描采集（ABOR）。采集卡住时用于重置。
    annotations:
      destructiveHint: false
    params: []
    handler: "instrument_mcp.commands.keysight_ps_handler.ps_acquire_abort"

  - name: ps_get_acquire_config
    description: 查询当前高速扫描采集配置（测量函数/点数/间隔/硬件上限），返回 JSON。
    annotations:
      readOnlyHint: true
    params: []
    handler: "instrument_mcp.commands.keysight_ps_handler.ps_get_acquire_config"

  # ─────────────────────────────────────────────
  # 诊断与健康检查（66300 系列通用）
  # 寄存器位映射依据手册 Table 4-1/7-1/8-5
  # ─────────────────────────────────────────────
  - name: ps_health_check
    description: >
      一键只读健康检查：自检(*TST?) + 错误队列排空 + 标准事件(*ESR?) +
      Questionable状态寄存器解码 + 保护配置 + 测量有效性判定(检测9.91e+37占位符)。
      返回综合 verdict：USABLE(正常) / WARNING(保护置位或测量无效) /
      NEEDS_SERVICE(自检非零或错误队列含硬件级错误码，按手册第41页需返修)。
      不改变仪器状态。
    annotations:
      readOnlyHint: true
    params: []
    handler: "instrument_mcp.diagnostics.keysight_ps_diag.ps_health_check"

  - name: ps_clear_protection
    description: >
      清除输出保护锁存(*CLS + OUTP:PROT:CLE)，可选关闭过压保护(OVP)，
      读回 QUES 确认是否清除成功。若故障源仍存在则清不掉(手册第111页)。
    annotations:
      destructiveHint: false
    params:
      - name: disable_ovp
        type: boolean
        description: 是否同时关闭过压保护(VOLT:PROT:STAT OFF)，用于排查OV是否误报。默认 false。
        default: false
    handler: "instrument_mcp.diagnostics.keysight_ps_diag.ps_clear_protection"
